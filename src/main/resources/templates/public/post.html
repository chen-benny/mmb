<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${post.title})}"></head>
<body>
<nav th:replace="~{layout :: nav(true)}"></nav>

<main class="container">
    <div class="preview-banner" th:if="${preview}">
        <span>Preview — <strong th:text="${post.status}">DRAFT</strong>. Only you can see this page.</span>
        <a th:href="@{/panorama/editor/{id}(id=${post.id})}">← Back to editor</a>
    </div>
    <article>
        <header class="post-header">
            <h1 th:text="${post.title}">Post Title</h1>
            <div class="post-meta">
                <a th:href="@{/panorama/{username}(username=${author.username})}"
                   th:text="${author.displayName}">Author</a>
                <span th:if="${post.publishedAt != null}"
                      th:text="${#temporals.format(post.publishedAt, 'yyyy-MM-dd')}"></span>
                <span th:if="${readingMinutes != null}" class="reading-time"
                      th:text="${readingMinutes} + ' min read'">5 min read</span>
                <span th:each="tag : ${post.tags}">
                    <a class="tag"
                       th:href="@{/panorama/{username}/tag/{slug}(username=${author.username}, slug=${tag.slug})}"
                       th:text="${tag.name}">tag</a>
                </span>
            </div>
        </header>

        <nav class="toc" th:if="${toc != null and toc.size() >= 3}">
            <span class="toc-title">Contents</span>
            <ul>
                <li th:each="entry : ${toc}" th:classappend="'toc-l' + ${entry.level()}">
                    <a th:href="'#' + ${entry.id()}" th:text="${entry.text()}">Section</a>
                </li>
            </ul>
        </nav>

        <div class="post-body" th:utext="${renderedBody}">
            Post content here.
        </div>
    </article>

    <section class="related" th:if="${relatedPosts != null and not #lists.isEmpty(relatedPosts)}">
        <span class="related-title">Related</span>
        <ul>
            <li th:each="rel : ${relatedPosts}">
                <a th:href="@{/panorama/{username}/{slug}(username=${author.username}, slug=${rel.slug})}"
                   th:text="${rel.title}">Related post</a>
                <span class="related-date"
                      th:text="${#temporals.format(rel.publishedAt, 'yyyy-MM-dd')}"></span>
            </li>
        </ul>
    </section>

    <nav class="post-nav">
        <div class="post-nav-prev">
            <a th:if="${prevPost != null}"
               th:href="@{/panorama/{username}/{slug}(username=${author.username}, slug=${prevPost.slug})}">
                ← <span th:text="${prevPost.title}"></span>
            </a>
        </div>
        <div class="post-nav-center">
            <a th:href="@{/panorama/{username}(username=${author.username})}"
               th:text="${author.displayName}">Author</a>
        </div>
        <div class="post-nav-next">
            <a th:if="${nextPost != null}"
               th:href="@{/panorama/{username}/{slug}(username=${author.username}, slug=${nextPost.slug})}">
                <span th:text="${nextPost.title}"></span> →
            </a>
        </div>
    </nav>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
